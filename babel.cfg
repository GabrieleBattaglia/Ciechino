# Ciechino, quali file legge pybabel per il catalogo dei testi, sul modello di MeTeOra.
# Autori: Gabriele Battaglia (IZ4APU) & ClaudIA (Claude Opus 5.5, UltraCode).
# Nasce il 2026-11-19 con la 0.1.0. I moduli del programma stanno nella radice e in gui; le prove, gli
# strumenti e i banchi di Gabriele e i due script della compilazione non hanno testi per l'utente.
# Il modello si estrae con plurale fra le parole chiave, la funzione di lingua.py che ha singolare e
# plurale come secondo e terzo argomento:
# pybabel extract -F babel.cfg -k plurale:2,3 --add-comments=Traduttori: -o locales/messages.pot .
[ignore: setup_maker.py]
[ignore: zip_maker.py]
[python: *.py]
[python: gui/*.py]
